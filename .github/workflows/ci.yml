name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spec/package-lock.json
      - run: npm ci
        working-directory: spec

      # Regenerating from the pinned spec must reproduce the committed code
      # (make generate pins oapi-codegen; generate-builders is deterministic).
      - name: Generated code matches the spec
        run: |
          make generate
          git diff --exit-code
          git -C spec diff --exit-code

      - run: go vet ./...

      # Integration tests skip without QB_REALM and QB_USER_TOKEN
      - run: go test ./...

  # apidiff (golang.org/x/exp) against the pull request's base, or the commit
  # before a push. Incompatible changes need a BREAKING entry in CHANGELOG.md
  # in the same change.
  api-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26" # apidiff needs it; the module itself needs 1.24
      - run: .github/scripts/api-compat.sh "${{ github.event.pull_request.base.sha || github.event.before }}"
